[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spanish-hebrew-kindle"
version = "0.1.0"
description = "Reproducible Spanish to Hebrew Kindle lookup dictionary builder"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
sh4k = "spanish_hebrew_kindle.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
